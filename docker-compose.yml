---
services:
  bookmarkarr:
    image: ${BOOKMARKARR_IMAGE:-ghcr.io/gitsumhubs/bookmarkarr:latest}
    container_name: bookmarkarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-022}
      - TZ=${TZ:-Etc/UTC}
      - BOOKMARKARR_LOG_LEVEL=${BOOKMARKARR_LOG_LEVEL:-Information}
      - BOOKMARKARR_PUBLIC_URL=${BOOKMARKARR_PUBLIC_URL:-}
      - BOOKMARKARR_AUTHENTICATION_REQUIRED=${BOOKMARKARR_AUTHENTICATION_REQUIRED:-false}
      - BOOKMARKARR_API_KEY=${BOOKMARKARR_API_KEY:-}
      - BOOKMARKARR_AUDIOBOOK_ROOT=/audiobooks
      - BOOKMARKARR_EBOOK_ROOT=/ebooks
      - BOOKMARKARR_DOWNLOADS_ROOT=/downloads
      - BOOKMARKARR_AUDIOBOOK_CATEGORY=${BOOKMARKARR_AUDIOBOOK_CATEGORY:-audiobooks}
      - BOOKMARKARR_EBOOK_CATEGORY=${BOOKMARKARR_EBOOK_CATEGORY:-ebooks}
    ports:
      - "${BOOKMARKARR_PORT:-3018}:4545"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BOOKMARKARR_CONFIG_PATH:-./data/config}:/app/config
      - ${BOOKMARKARR_AUDIOBOOKS_PATH:-./data/audiobooks}:/audiobooks
      - ${BOOKMARKARR_EBOOKS_PATH:-./data/ebooks}:/ebooks
      - ${BOOKMARKARR_DOWNLOADS_PATH:-./data/downloads}:/downloads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:4545/api/v1/system/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

    # ─────────────────────────────────────────────────────────────────────────
    # CONNECTING TO NZBGET / PROWLARR / YOUR TORRENT CLIENT
    #
    # Most setups run each of these in its own compose file, which puts them on
    # separate Docker networks. Until Bookmarkarr joins those networks, hostnames
    # like http://nzbget:6789 will NOT resolve and every connection test fails.
    #
    # 1. List your networks:   docker network ls
    # 2. Uncomment the block below AND the networks: section at the bottom.
    # 3. Replace the name: values with your real network names.
    # 4. Delete any entry for a service you don't run.
    #
    # Names are usually <foldername>_default, taken from the DIRECTORY the other
    # compose file lives in - not the service name. A Prowlarr in a folder called
    # prowlarr-abb creates prowlarr-abb_default, so always copy from the command
    # above rather than guessing.
    #
    # Not needed if everything is in one compose file, or if you address the
    # other services by LAN URL such as http://192.168.1.50:6789.
    #
    # networks:
    #   - default
    #   - nzbget
    #   - prowlarr
    #   - torrent

# networks:
#   nzbget:
#     external: true
#     name: nzbget_default
#   prowlarr:
#     external: true
#     name: prowlarr_default
#   torrent:
#     external: true
#     name: rdtclient_default      # or qbittorrent_default, transmission_default, ...
