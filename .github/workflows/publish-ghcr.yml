name: Publish multi-architecture image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Re-pushing a deleted tag does not reliably re-trigger the push event, so a failed release
  # can otherwise only be retried by burning a new version number.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build (for example v0.1.19)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bookmarkarr
          # `value` pins what the semver patterns read. Without it they fall back to github.ref,
          # which on workflow_dispatch is the branch the dispatch was made from — so a retried
          # release built the right commit and published it as `latest` alone, with no version
          # tag at all. The retry path is the one that most needs to produce a version.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref }}
            type=semver,pattern={{major}},value=${{ inputs.ref || github.ref }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min caches only the final stage's layers. mode=max caches every intermediate
          # layer of a multi-arch .NET build, which grew past GitHub's 10 GB per-repository cache
          # limit; once over, buildx reports the cache failure as a push denial and the release
          # never publishes.
          cache-to: type=gha,mode=min
