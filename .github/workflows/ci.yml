name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: dotnet restore bookmarkarr.slnx --locked-mode
      - run: npm ci
        working-directory: fe
      - run: npm run type-check
        working-directory: fe
      - run: npm run test:unit
        working-directory: fe
      - run: dotnet test bookmarkarr.slnx -c Release --no-restore
        env:
          ASPNETCORE_ENVIRONMENT: Test
          Playwright__Enabled: 'false'
      - run: python3 -m unittest discover -s tools/bookmarkarr-migrate -p 'test_*.py'
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker build --check .
